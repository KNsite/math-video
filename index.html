<style>
:root{
  --wood:#8a5a34; --wood-dark:#6e4527;
  --board:#2f4538; --board-dark:#24362b;
  --chalk:#f2ede0; --chalk-dim:#cfd6c9; --chalk-yellow:#e8c468; --chalk-pink:#e2a5a0; --chalk-blue:#9fc2c9;
  --cork:#c9a06a; --cork-dot:#b88d57;
  --paper:#fbf6ea; --paper-edge:#e7dcc3;
  --ink:#3a2e22; --ink-soft:#6b5c48;
  --page:#efe6d0;
  --pin:#b5473f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1d1a15; --cork:#5a4528; --cork-dot:#4c3a21;
    --paper:#2b261e; --paper-edge:#3c3428; --ink:#f0e8d6; --ink-soft:#c3b598;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#1d1a15; --cork:#5a4528; --cork-dot:#4c3a21;
  --paper:#2b261e; --paper-edge:#3c3428; --ink:#f0e8d6; --ink-soft:#c3b598;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.7}
a{color:inherit}
:focus-visible{outline:3px solid var(--chalk-yellow);outline-offset:2px}

/* 黒板ヘッダー */
.frame{background:linear-gradient(180deg,var(--wood),var(--wood-dark));padding:14px 14px 18px}
.board{max-width:1040px;margin:0 auto;background:radial-gradient(ellipse at 30% 20%,#3a5545,var(--board) 60%,var(--board-dark));border-radius:6px;padding:28px 28px 22px;color:var(--chalk);box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.board h1{font-family:"Yomogi",cursive;font-weight:400;font-size:clamp(2rem,6vw,3rem);margin:0;line-height:1.2;letter-spacing:.05em}
.board h1 a{text-decoration:none}
.board .sub{margin:6px 0 0;color:var(--chalk-dim)}
.board .tray{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:16px;font-size:.9rem}
.board .tray a{color:var(--chalk-yellow);text-decoration:none;border-bottom:1px dashed var(--chalk-yellow)}
.chalks{display:flex;gap:8px;justify-content:flex-end;max-width:1040px;margin:8px auto 0}
.chalks i{display:block;width:34px;height:7px;border-radius:3px}

main{max-width:1040px;margin:0 auto;padding:24px 16px 56px;display:grid;gap:22px}
.note{background:var(--paper);border:1px solid var(--paper-edge);border-left:6px solid var(--chalk-yellow);border-radius:4px;padding:10px 14px;font-size:.92rem;margin:0}

/* コルクボード */
.cork{background-color:var(--cork);background-image:radial-gradient(var(--cork-dot) 1.2px,transparent 1.4px);background-size:9px 9px;border:10px solid var(--wood);border-radius:6px;padding:22px 18px}
.cork h2{font-family:"Yomogi",cursive;font-weight:400;font-size:1.7rem;margin:0 0 4px;display:inline-block;background:var(--paper);color:var(--ink);padding:2px 14px;border-radius:2px;transform:rotate(-1deg)}
.cork .meta{color:#fff;font-size:.9rem;margin:6px 0 14px;text-shadow:0 1px 2px rgba(0,0,0,.5)}

.subjects{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sub-card{position:relative;display:block;text-decoration:none;background:var(--paper);border-radius:3px;padding:20px 18px 16px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.sub-card:hover{transform:rotate(-.6deg)}
.sub-card::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pin);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.sub-card b{font-size:1.5rem;display:block}
.sub-card span{font-size:.88rem;color:var(--ink-soft)}

/* 検索 */
.find{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);border-radius:4px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.find label{font-family:"Yomogi",cursive;font-size:1.2rem}
.find input{font:inherit;font-size:1.1rem;width:9em;color:var(--ink);background:var(--page);border:1px solid var(--paper-edge);border-radius:4px;padding:6px 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--ink-soft);border-radius:999px;padding:2px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:.9rem;color:var(--ink-soft);margin-left:auto}

/* 番号札 */
.group{margin-top:20px}
.group h3{font-family:"Yomogi",cursive;font-weight:400;font-size:1.5rem;color:#fff;margin:0 0 10px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.group h3 small{font-size:1rem;margin-left:8px}
.tiles{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:96px;text-decoration:none;background:var(--paper);border-radius:3px;border-top:7px solid var(--tc);box-shadow:0 3px 6px rgba(0,0,0,.25);padding:8px 6px;text-align:center}
.tiles li:nth-child(3n+1) .tile{transform:rotate(-1.2deg)}
.tiles li:nth-child(3n+2) .tile{transform:rotate(.8deg)}
.tile:hover{transform:translateY(-2px) rotate(0)!important}
.tile .k{font-size:.72rem;font-weight:700;color:var(--ink-soft);letter-spacing:.08em}
.tile .n{font-size:2rem;font-weight:700;line-height:1.1}
.tile .t{font-size:.75rem;color:var(--ink-soft);line-height:1.35;margin-top:2px}
.tile .play{font-size:.72rem;margin-top:4px;color:var(--ink-soft)}
.STEP{--tc:var(--chalk-blue)} .TRIAL{--tc:var(--chalk-pink)}
.empty{background:var(--paper);border-radius:3px;padding:14px;margin:0}
.back{color:#fff;font-size:.92rem}
footer{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:0 16px 32px}
@media (prefers-reduced-motion:reduce){.tile,.sub-card{transform:none!important}}
</style>
</head>
<body>
<div class="frame">
  <header class="board">
    <h1><a href="#home" id="title"></a></h1>
    <p class="sub" id="subtitle"></p>
    <div class="tray"><a id="noteLink" href="#">数学ノートに戻る</a></div>
  </header>
  <div class="chalks" aria-hidden="true"><i style="background:var(--chalk)"></i><i style="background:var(--chalk-yellow)"></i><i style="background:var(--chalk-pink)"></i><i style="background:var(--chalk-blue)"></i></div>
</div>

<main id="view"></main>
<footer id="foot"></footer>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const byId = Object.fromEntries(LIB.subjects.map(s => [s.id, s]));
  $("#title").textContent = LIB.title;
  $("#subtitle").textContent = LIB.subtitle;
  $("#noteLink").href = LIB.noteUrl || "#";
  $("#foot").textContent = LIB.title;
  const total = s => s.groups.reduce((a,g) => a + g.videos.length, 0);
  const note = LIB.notice ? `<p class="note">${esc(LIB.notice)}</p>` : "";

  function home(){
    return `${note}
    <section class="cork"><h2>科目をえらぶ</h2>
      <p class="meta">動画がある科目だけ並んでいます</p>
      <div class="subjects">${LIB.subjects.map(s => `<a class="sub-card" href="#${s.id}"><b>${esc(s.name)}</b>
        <span>${esc(s.book || "")}${s.book ? "　" : ""}動画 ${total(s)}本</span></a>`).join("")}</div>
    </section>`;
  }

  let filter = "all", query = "";
  function subject(s){
    const segs = [{id:"all", name:"すべて"}, ...s.groups.map(g => ({id:g.name, name:`${g.name}（${g.label}）`}))];
    return `${note}
    <section class="cork">
      <h2>${esc(s.name)}</h2>
      <p class="meta">${esc(s.book || "")}　<a class="back" href="#home">科目一覧へ</a></p>
      <div class="find">
        <label for="q">問題番号</label>
        <input id="q" inputmode="numeric" autocomplete="off" placeholder="例：24" value="${esc(query)}">
        <div class="seg" role="group" aria-label="種類">${segs.map(x => `<button data-f="${x.id}" aria-pressed="${filter === x.id}">${esc(x.name)}</button>`).join("")}</div>
        <span class="count" id="count" role="status"></span>
      </div>
      <div id="groups"></div>
    </section>`;
  }
  function renderGroups(s){
    const q = query.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, "");
    let n = 0;
    const html = s.groups.filter(g => filter === "all" || filter === g.name).map(g => {
      const vs = [...g.videos].sort((a,b) => a.no - b.no).filter(v => !q || String(v.no).startsWith(q));
      n += vs.length;
      if (!vs.length) return "";
      return `<div class="group ${esc(g.name)}"><h3>${esc(g.name)}<small>${esc(g.label)}</small></h3>
        <ul class="tiles">${vs.map(v => `<li><a class="tile" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(g.name)} ${v.no} の解説動画を開く">
          <span class="k">${esc(g.name)}</span><span class="n">${v.no}</span>${v.title ? `<span class="t">${esc(v.title)}</span>` : ""}<span class="play">▶ 動画</span></a></li>`).join("")}</ul></div>`;
    }).join("");
    $("#groups").innerHTML = html || `<div class="group"><p class="empty">${q ? `${esc(q)} 番の動画はまだありません。番号を確かめるか、「すべて」を選んでください。` : "まだ動画が登録されていません。"}</p></div>`;
    $("#count").textContent = `${n}本`;
  }

  function render(){
    const id = location.hash.slice(1);
    const s = byId[id];
    const v = $("#view");
    if (s){
      v.innerHTML = subject(s);
      renderGroups(s);
      $("#q").addEventListener("input", e => { query = e.target.value; renderGroups(s); });
      v.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
        filter = b.dataset.f;
        v.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
        renderGroups(s);
      }));
      document.title = s.name + "｜" + LIB.title;
    } else {
      v.innerHTML = home();
      document.title = LIB.title;
    }
  }
  window.addEventListener("hashchange", () => { filter = "all"; query = ""; render(); window.scrollTo(0,0); });
  render();
})();
</script>
</body>
</html>
